name: Update changelog

# Runs for every push to the branches that dea is deployed from. The changelog commit goes back
# to the same branch, so the site that Render builds from it shows the new entry.
on:
  push:
    branches:
      - main
      - feat/among-us-capture

permissions:
  contents: write

concurrency:
  group: changelog-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Create a user-facing entry for pushed changes
        run: node scripts/update-changelog.mjs "$(git rev-parse HEAD)"

      - name: Commit and push the updated changelog
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- artifacts/api-server/web/changelog.json .github/changelog-state.json; then
            echo "No user-facing changes to add to the changelog."
            exit 0
          fi
          git config user.name "deabzino"
          git config user.email "162216131+deabzino@users.noreply.github.com"
          git add -- artifacts/api-server/web/changelog.json .github/changelog-state.json
          git commit -m "docs: update changelog"
          # Someone may have pushed while this ran. Rebase onto it rather than failing.
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
